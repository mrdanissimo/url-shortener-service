databaseChangeLog:
  - changeSet:
      id: 2-create-failed-click-events-table
      author: mrdanissimo
      logicalFilePath: db/changelog/db.changelog-master.yml
      changes:
        - createTable:
            tableName: failed_click_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: short_code
                  type: VARCHAR(255)

              - column:
                  name: original_url
                  type: VARCHAR(255)

              - column:
                  name: clicked_at
                  type: TIMESTAMP

              - column:
                  name: user_agent
                  type: VARCHAR(255)

              - column:
                  name: correlation_id
                  type: VARCHAR(255)